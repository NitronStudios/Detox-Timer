<!DOCTYPE html>
<html lang="en" data-theme="flip">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOCUS — Flip Clock Study Timer</title>
  <meta name="description" content="Flip clock study timer with Pomodoro, Stopwatch, Clock and Analytics Dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet" />

  <!-- React + Babel via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ================================================================
       CSS DESIGN TOKENS — 3 THEMES
       ================================================================ */
    :root,
    [data-theme="flip"] {
      --bg:          #000000;
      --bg2:         #0a0a0a;
      --card:        #151515;
      --card2:       #1e1e1e;
      --text:        #C8C8C8;
      --text-muted:  #555555;
      --accent:      #4CAF50;
      --divider:     #1a1a1a;
      --border:      #2a2a2a;
      --btn-bg:      #1a1a1a;
      --btn-border:  #333333;
      --split:       #000000;
      --shadow:      rgba(0,0,0,0.7);
      --transition:  all 0.22s ease;
    }
    [data-theme="dark"] {
      --bg:          #141414;
      --bg2:         #1a1a1a;
      --card:        #1e1e1e;
      --card2:       #252525;
      --text:        #F0F0F0;
      --text-muted:  #666666;
      --accent:      #4CAF50;
      --divider:     #2e2e2e;
      --border:      #333333;
      --btn-bg:      #252525;
      --btn-border:  #3a3a3a;
      --split:       #141414;
      --shadow:      rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg:          #FDFDFD;
      --bg2:         #F5F5F5;
      --card:        #EEEEEE;
      --card2:       #E5E5E5;
      --text:        #1A1A1A;
      --text-muted:  #7A7A7A;
      --accent:      #4CAF50;
      --divider:     #E0E0E0;
      --border:      #CCCCCC;
      --btn-bg:      #EFEFEF;
      --btn-border:  #CCCCCC;
      --split:       #FDFDFD;
      --shadow:      rgba(0,0,0,0.08);
    }

    /* ================================================================
       RESET & BASE
       ================================================================ */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ================================================================
       APP SHELL & ANIMATIONS
       ================================================================ */
    #root { height: 100%; }
    .app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
    
    .app-main {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    
    .page-wrapper {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, border-radius 0.6s ease, border-color 0.3s ease;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .page-wrapper.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
      z-index: 10;
      border-radius: 0;
      border: 0px solid transparent;
    }
    .page-wrapper.mini {
      opacity: 1;
      pointer-events: auto;
      z-index: 50;
      transform-origin: bottom left;
      /* Scales down to 25% and translates to keep a nice margin from the corner */
      transform: scale(0.25) translate(100px, -100px);
      border-radius: 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      cursor: pointer;
      border: 8px solid var(--border);
    }
    .page-wrapper.mini:hover {
      transform: scale(0.27) translate(90px, -90px);
      border-color: var(--accent);
    }
    /* Disable clicks inside the mini view so the whole card restores the page */
    .page-wrapper.mini * {
      pointer-events: none !important; 
    }
    .page-wrapper.hidden {
      display: none;
    }

    /* ================================================================
       NAVBAR
       ================================================================ */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 1.75rem;
      border-bottom: 1px solid var(--divider);
      background: var(--bg);
      flex-shrink: 0;
      transition: background 0.3s ease;
      z-index: 10;
    }
    .navbar-brand {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
      min-width: 70px;
    }
    .navbar-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--card);
      border-radius: 8px;
      padding: 3px;
    }
    .tab-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.35rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    .tab-btn.active {
      background: var(--card2);
      color: var(--text);
    }
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 70px;
      justify-content: flex-end;
    }
    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.8rem;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .icon-btn.active { color: var(--accent); border-color: var(--accent); }

    /* ================================================================
       PAGE CONTAINER
       ================================================================ */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ================================================================
       FLIP CARD DIGIT
       ================================================================ */
    .flip-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .flip-separator {
      font-size: clamp(2.5rem, 5vw, 5rem);
      font-weight: 800;
      color: var(--text-muted);
      line-height: 1;
      padding-bottom: 0.1em;
      user-select: none;
    }
    .flip-card {
      position: relative;
      width: clamp(70px, 10vw, 130px);
      height: clamp(100px, 14vw, 185px);
      perspective: 600px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }
    /* Static top half — shows current digit (top portion) */
    .fc-top {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 50%;
      background: var(--card);
      /* Only round the outer (top) corners; keep inner edge sharp */
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-end;   /* digit text aligns to split edge */
      justify-content: center;
      line-height: 0;           /* magic fix: centres text exactly on split */
    }
    /* Static bottom half — shows current digit (bottom portion) */
    .fc-bottom {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 50%;
      background: var(--card);
      /* Only round the outer (bottom) corners; keep inner edge sharp */
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-start; /* digit text aligns to split edge */
      justify-content: center;
      line-height: 0;
    }
    /* Digit text inside static halves */
    .fc-top .fc-digit,
    .fc-bottom .fc-digit {
      font-size: clamp(3rem, 8.5vw, 9rem);
      font-weight: 800;
      color: var(--text);
      line-height: 0;   /* inherit the 0 line-height for precise centering */
      user-select: none;
    }

    /* Animated top flap (flips away — shows PREVIOUS digit) */
    .fc-flap-top {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 50%;
      background: var(--card);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      line-height: 0;
      transform-origin: bottom center;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      z-index: 3;
    }
    .fc-flap-top.animating { animation: flipTop 0.28s ease-in forwards; }
    /* Animated bottom flap (flips in — shows CURRENT digit) */
    .fc-flap-bottom {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 50%;
      background: var(--card);
      border-top-left-radius: 0;
      border-top-right-radius: 0;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      line-height: 0;
      transform-origin: top center;
      transform: rotateX(90deg);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      z-index: 3;
    }
    .fc-flap-bottom.animating { animation: flipBottom 0.28s ease-out 0.28s forwards; }

    /* Digit text inside flap halves — line-height:0 inherited, no extra transforms needed */
    .fc-flap-top .fc-digit,
    .fc-flap-bottom .fc-digit {
      font-size: clamp(3rem, 8.5vw, 9rem);
      font-weight: 800;
      color: var(--text);
      line-height: 0;
      user-select: none;
    }

    @keyframes flipTop {
      0%   { transform: rotateX(0deg);  }
      100% { transform: rotateX(-90deg); }
    }
    @keyframes flipBottom {
      0%   { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg);  }
    }

    /* Centre split line */
    .fc-split {
      position: absolute;
      top: 50%; left: 0;
      width: 100%; height: 4px;
      background: var(--split);
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
    }
    /* Shadow between halves for depth */
    .fc-shadow-top {
      position: absolute;
      top: 50%; left: 0;
      width: 100%; height: 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.25), transparent);
      z-index: 5;
      pointer-events: none;
    }

    /* ================================================================
       SUBJECT INPUT (Dynamic Scaling)
       ================================================================ */
    .subject-wrap {
      margin-bottom: clamp(1.5rem, 4vh, 3rem);
      text-align: center;
    }
    .subject-input {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      outline: none;
      font-family: inherit;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 400;
      color: var(--text);
      text-align: center;
      padding: 0.5rem 0;
      width: clamp(250px, 40vw, 550px);
      transition: var(--transition);
      caret-color: var(--accent);
    }
    .subject-input::placeholder { color: var(--text-muted); }
    .subject-input:focus { border-bottom-color: var(--accent); }
    .subject-input.locked { color: var(--accent); font-weight:500; pointer-events:none; border-bottom-color:transparent; }

    /* ================================================================
       MODE SELECTOR (Dynamic Scaling)
       ================================================================ */
    .mode-select {
      display: flex;
      gap: 0.5rem;
      background: var(--card);
      border-radius: 8px;
      padding: 6px;
      margin-bottom: clamp(1.2rem, 3vh, 2rem);
    }
    .mode-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    .mode-btn.active { background: var(--card2); color: var(--text); }

    /* ================================================================
       POMODORO CONFIG (Dynamic Scaling)
       ================================================================ */
    .pomo-config {
      display: flex;
      gap: clamp(2rem, 5vw, 4rem);
      margin-bottom: clamp(1.2rem, 3vh, 2rem);
      align-items: center;
    }
    .pomo-field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .pomo-label {
      font-size: clamp(0.75rem, 1vw, 0.9rem);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .pomo-stepper {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .pomo-stepper button {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text);
      font-family: inherit;
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      width: clamp(32px, 3.5vw, 40px); 
      height: clamp(32px, 3.5vw, 40px);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .pomo-stepper button:hover { border-color: var(--text-muted); }
    .pomo-stepper button:disabled { opacity:0.3; cursor:not-allowed; }
    .pomo-value {
      font-size: clamp(1.3rem, 2vw, 1.6rem);
      font-weight: 600;
      color: var(--text);
      min-width: 3ch;
      text-align: center;
    }
    .phase-pill {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: var(--transition);
    }
    .phase-pill.study { border-color: var(--accent); color: var(--accent); }
    .phase-pill.break-phase { border-color: var(--text-muted); color: var(--text-muted); }

    /* ================================================================
       TIMER CONTROLS
       ================================================================ */
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: clamp(1rem, 3vh, 2rem);
      align-items: center;
    }
    .ctrl-btn {
      font-family: inherit;
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 2rem;
      height: clamp(45px, 6vh, 55px);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    .ctrl-btn-primary {
      background: var(--accent);
      border: none;
      color: #fff;
    }
    .ctrl-btn-primary:hover { filter: brightness(0.9); }
    .ctrl-btn-outline {
      background: transparent;
      border: 1.5px solid var(--text-muted);
      color: var(--text);
    }
    .ctrl-btn-outline:hover { border-color: var(--text); background: var(--card); }
    .ctrl-btn-resume {
      background: var(--accent);
      border: none;
      color: #fff;
    }
    .ctrl-btn-resume:hover { filter: brightness(0.9); }

    /* ================================================================
       STOPWATCH PAGE
       ================================================================ */
    .laps-container {
      margin-top: 1.5rem;
      width: clamp(240px, 40vw, 460px);
      max-height: 140px;
      overflow-y: auto;
    }
    .lap-entry {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--divider);
      color: var(--text);
    }
    .lap-entry:last-child { border-bottom: none; }
    .lap-num { color: var(--text-muted); }

    /* ================================================================
       CLOCK PAGE
       ================================================================ */
    .clock-date {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 1rem;
    }

    /* ================================================================
       DASHBOARD OVERLAY
       ================================================================ */
    .dash-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }
    .dash-navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 1.75rem;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .dash-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text);
    }
    .dash-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 2rem;
      padding: 2rem;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .dash-content {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
    }
    .dash-left, .dash-right { 
      display: flex; 
      flex-direction: column; 
      gap: 1.5rem; 
      height: 100%; 
    }
    
    .dash-left > div:last-child {
      display: block; /* Removed flex stretching */
    }

    .chart-wrap { 
      width: 100%; 
      margin-top: 0.5rem;
    }
    .summary-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .summary-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
    }
    .chart-title, .sessions-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
    .sessions-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .session-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--divider);
    }
    .session-row:last-child { border-bottom:none; }
    .session-info { display:flex; flex-direction:column; gap:0.1rem; }
    .session-subject { color: var(--text); font-weight:400; }
    .session-dur { color: var(--text-muted); font-size:0.75rem; }
    .session-time { color: var(--text-muted); font-size:0.78rem; font-variant-numeric:tabular-nums; }
    .session-actions { display:flex; align-items:center; gap:0.5rem; }
    .btn-del {
      background:none; border:none; cursor:pointer;
      color: var(--text-muted); font-size:0.75rem;
      padding:2px 5px; border-radius:3px;
      transition:var(--transition);
    }
    .btn-del:hover { color:var(--text); }
    .empty-msg { color:var(--text-muted); font-size:0.82rem; font-style:italic; padding:2rem 0; text-align:center; }

    /* Scrollbars */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }

    /* Scale & Fade Transitions for Focus Mode */
    .timer-clock {
      transition: transform 0.5s ease-in-out;
      transform-origin: center center;
    }
    .scale-100 {
      transform: scale(1);
    }
    .scale-\[2\.2\] {
      transform: scale(2.2);
    }
    .transition-all {
      transition: all 0.5s ease-in-out;
    }
    .transition-opacity {
      transition: opacity 0.3s ease-in-out;
    }
    .duration-500 {
      transition-duration: 500ms;
    }
    .duration-300 {
      transition-duration: 300ms;
    }
    .ease-in-out {
      transition-timing-function: ease-in-out;
    }
    .opacity-0 {
      opacity: 0 !important;
      pointer-events: none;
    }
    .opacity-100 {
      opacity: 1 !important;
    }
    .flex {
      display: flex;
    }
    .gap-4 {
      gap: 1rem;
    }
    .mt-8 {
      margin-top: 2rem;
    }

    /* Settings panel styling */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--divider);
    }
    .settings-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .settings-input {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.35rem 0.5rem;
      width: 80px;
      text-align: center;
      outline: none;
      transition: var(--transition);
    }
    .settings-input:focus {
      border-color: var(--accent);
    }
    /* Hide number input spinners */
    .settings-input::-webkit-outer-spin-button,
    .settings-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .settings-input[type="number"] {
      -moz-appearance: textfield;
    }
    .settings-toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .settings-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border);
      transition: .3s;
      border-radius: 34px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text);
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: var(--accent);
    }
    input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }
    .color-picker {
      display: flex;
      gap: 0.75rem;
    }
    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
    }
    .color-dot:hover {
      transform: scale(1.1);
    }
    .color-dot.active {
      border-color: var(--text);
      transform: scale(1.1);
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ================================================================
   STORAGE HELPERS
   ================================================================ */
const STORAGE_KEY = 'focus_sessions';

function getSessions() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function saveSession(subject, elapsedSeconds) {
  if (elapsedSeconds < 5) return null;
  const durationMinutes = Math.max(1, Math.round(elapsedSeconds / 60));
  const now = new Date();
  const offset = now.getTimezoneOffset();
  const local = new Date(now.getTime() - offset * 60000);
  const entry = {
    id: Math.floor(Date.now() / 1000),
    date: local.toISOString().split('T')[0],
    subject: subject || 'Study',
    durationMinutes
  };
  const sessions = getSessions();
  sessions.push(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  return entry;
}

function deleteSession(id) {
  const sessions = getSessions().filter(s => s.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function getTodayStr() {
  const d = new Date();
  const offset = d.getTimezoneOffset();
  const local = new Date(d.getTime() - offset * 60000);
  return local.toISOString().split('T')[0];
}

/* ================================================================
   FLIP CARD — single digit with 3D animation
   ================================================================ */
function FlipCard({ digit }) {
  // Track the previous digit to handle the flip transition accurately
  const prevDigitRef = useRef(digit);
  const prevDigit = prevDigitRef.current;

  // Update the reference AFTER the render so the flaps can animate the change
  useEffect(() => {
    prevDigitRef.current = digit;
  }, [digit]);

  const isAnimating = digit !== prevDigit;

  return (
    <div className="flip-card">
      <div className="flip-card-inner">
        {/* STATIC TOP: Shows the NEW digit waiting behind the flap */}
        <div className="fc-top">
          <span className="fc-digit">{digit}</span>
        </div>
        
        {/* STATIC BOTTOM: Shows the OLD digit until the bottom flap lands */}
        <div className="fc-bottom">
          <span className="fc-digit">{prevDigit}</span>
        </div>
        
        {/* ANIMATING FLAPS: The key prop forces a re-mount, re-triggering CSS animations on change */}
        <div className={`fc-flap-top${isAnimating ? ' animating' : ''}`} key={`top-${digit}`}>
          <span className="fc-digit">{prevDigit}</span>
        </div>
        
        <div className={`fc-flap-bottom${isAnimating ? ' animating' : ''}`} key={`bottom-${digit}`}>
          <span className="fc-digit">{digit}</span>
        </div>
        
        <div className="fc-split" />
        <div className="fc-shadow-top" />
      </div>
    </div>
  );
}

/* ================================================================
   FLIP DISPLAY — 4 or 6 digits
   ================================================================ */
function FlipDisplay({ seconds, showHours = false }) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  const hStr = String(h).padStart(2, '0');
  const mStr = String(m).padStart(2, '0');
  const sStr = String(s).padStart(2, '0');

  return (
    <div className="flip-group">
      {showHours && <>
        <FlipCard digit={hStr[0]} />
        <FlipCard digit={hStr[1]} />
        <span className="flip-separator">:</span>
      </>}
      <FlipCard digit={mStr[0]} />
      <FlipCard digit={mStr[1]} />
      <span className="flip-separator">:</span>
      <FlipCard digit={sStr[0]} />
      <FlipCard digit={sStr[1]} />
    </div>
  );
}

/* ================================================================
   POMODORO CONFIG
   ================================================================ */
function PomodoroConfig({ studyMin, breakMin, onStudy, onBreak, disabled }) {
  return (
    <div className="pomo-config">
      <div className="pomo-field">
        <span className="pomo-label">Study (min)</span>
        <div className="pomo-stepper">
          <button onClick={() => onStudy(s => Math.max(1, s - 1))} disabled={disabled || studyMin <= 1}>−</button>
          <span className="pomo-value">{studyMin}</span>
          <button onClick={() => onStudy(s => Math.min(90, s + 1))} disabled={disabled || studyMin >= 90}>+</button>
        </div>
      </div>
      <div className="pomo-field">
        <span className="pomo-label">Break (min)</span>
        <div className="pomo-stepper">
          <button onClick={() => onBreak(b => Math.max(1, b - 1))} disabled={disabled || breakMin <= 1}>−</button>
          <span className="pomo-value">{breakMin}</span>
          <button onClick={() => onBreak(b => Math.min(30, b + 1))} disabled={disabled || breakMin >= 30}>+</button>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   TIMER PAGE
   ================================================================ */
function TimerPage({ settings, onStateChange }) {
  const [mode, setMode] = useState('pomodoro');
  const [studyMin, setStudyMin] = useState(settings.studyMin);
  const [breakMin, setBreakMin] = useState(settings.breakMin);
  const [normalMin, setNormalMin] = useState(settings.normalMin);
  const [phase, setPhase] = useState('study');
  const [timeLeft, setTimeLeft] = useState(settings.studyMin * 60);
  const [elapsed, setElapsed] = useState(0);
  const [isRunning, setIsRunning] = useState(false);
  const [isPaused, setIsPaused] = useState(false);
  const [subject, setSubject] = useState('');
  const intervalRef = useRef(null);

  // Sync settings when defaults change
  useEffect(() => {
    if (!isRunning && !isPaused) {
      setStudyMin(settings.studyMin);
      setBreakMin(settings.breakMin);
      setNormalMin(settings.normalMin);
      if (mode === 'pomodoro') {
        setTimeLeft(settings.studyMin * 60);
        setPhase('study');
      } else {
        setTimeLeft(settings.normalMin * 60);
      }
      setElapsed(0);
    }
  }, [settings.studyMin, settings.breakMin, settings.normalMin, mode, isRunning, isPaused]);

  // Sync timeLeft when local steppers change
  useEffect(() => {
    if (!isRunning && !isPaused) {
      if (mode === 'pomodoro') {
        setTimeLeft(studyMin * 60);
        setPhase('study');
      } else {
        setTimeLeft(normalMin * 60);
      }
      setElapsed(0);
    }
  }, [mode, studyMin, normalMin]);

  useEffect(() => {
    if (isRunning) {
      intervalRef.current = setInterval(() => {
        setTimeLeft(t => {
          if (t <= 1) {
            clearInterval(intervalRef.current);
            handlePhaseEnd();
            return 0;
          }
          return t - 1;
        });
        setElapsed(e => e + 1);
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [isRunning]);

  // Tab Title Timer effect
  useEffect(() => {
    if (isRunning || isPaused) {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const mStr = String(m).padStart(2, '0');
      const sStr = String(s).padStart(2, '0');
      document.title = `(${mStr}:${sStr}) FOCUS`;
    } else {
      document.title = "FOCUS — Flip Clock Study Timer";
    }
    return () => {
      document.title = "FOCUS — Flip Clock Study Timer";
    };
  }, [timeLeft, isRunning, isPaused]);

  // Track active state for Mini Mode
  useEffect(() => {
    if (onStateChange) {
      onStateChange(isRunning || isPaused);
    }
  }, [isRunning, isPaused, onStateChange]);

  const playBeep = () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  };

  function handlePhaseEnd() {
    setIsRunning(false);
    if (settings.audioEnabled) {
      try {
        playBeep();
      } catch (e) {
        console.error("Audio Context playback failed:", e);
      }
    }
    if (mode === 'pomodoro') {
      if (phase === 'study') {
        setPhase('break');
        setTimeLeft(breakMin * 60);
        setElapsed(0);
      } else {
        setPhase('study');
        setTimeLeft(studyMin * 60);
        setElapsed(0);
      }
    } else {
      handleSave();
    }
  }

  function handleStart() {
    setIsRunning(true);
    setIsPaused(false);
  }

  function handlePause() {
    clearInterval(intervalRef.current);
    setIsRunning(false);
    setIsPaused(true);
  }

  function handleResume() {
    setIsRunning(true);
    setIsPaused(false);
  }

  function handleSave() {
    clearInterval(intervalRef.current);
    saveSession(subject.trim() || 'Focus Session', elapsed);
    setIsRunning(false);
    setIsPaused(false);
    setSubject('');
    setPhase('study');
    setElapsed(0);
    if (mode === 'pomodoro') {
      setTimeLeft(studyMin * 60);
    } else {
      setTimeLeft(normalMin * 60);
    }
  }

  function handleStopClick() {
    if (settings.strictMode) {
      if (window.confirm('Strict Mode: Are you sure you want to break your focus?')) {
        handleSave();
      }
    } else {
      handleSave();
    }
  }

  const active = isRunning || isPaused;

  return (
    <div className="page" style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
      
      {/* Hide Menus Completely When Active */}
      {!active && (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', transition: 'all 0.3s' }}>
          <div className="mode-select">
            <button className={`mode-btn${mode === 'pomodoro' ? ' active' : ''}`} onClick={() => setMode('pomodoro')}>Pomodoro</button>
            <button className={`mode-btn${mode === 'normal' ? ' active' : ''}`} onClick={() => setMode('normal')}>Normal</button>
          </div>

          {mode === 'pomodoro' ? (
            <PomodoroConfig studyMin={studyMin} breakMin={breakMin} onStudy={setStudyMin} onBreak={setBreakMin} disabled={active} />
          ) : (
            <div className="pomo-config">
              <div className="pomo-field">
                <span className="pomo-label">Duration (min)</span>
                <div className="pomo-stepper">
                  <button onClick={() => setNormalMin(m => Math.max(1, m - 5))} disabled={active || normalMin <= 1}>−</button>
                  <span className="pomo-value">{normalMin}</span>
                  <button onClick={() => setNormalMin(m => Math.min(120, m + 5))} disabled={active || normalMin >= 120}>+</button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Subject and Phase Info (Moves to Top when Active) */}
      <div style={{
        position: active ? 'absolute' : 'relative',
        top: active ? '8%' : 'auto',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        transition: 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)',
        transform: active ? 'scale(1.3)' : 'scale(1)',
        zIndex: 10
      }}>
        {mode === 'pomodoro' && active && (
          <div className={`phase-pill${phase === 'study' ? ' study' : ' break-phase'}`} style={{ marginBottom: '10px' }}>
            {phase === 'study' ? '● Study' : '● Break'}
          </div>
        )}
        <div className="subject-wrap" style={{ margin: 0 }}>
          <input
            className={`subject-input${active ? ' locked' : ''}`}
            type="text"
            placeholder="What are you studying?"
            value={subject}
            onChange={e => setSubject(e.target.value)}
            readOnly={active}
            maxLength={50}
          />
        </div>
      </div>

      {/* Clock Wrapper (Scales up 2.8x when Active) */}
      <div style={{
        transform: active ? 'scale(2.8)' : 'scale(1)',
        transition: 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)',
        marginTop: active ? '0' : '20px',
        zIndex: 5
      }}>
        <FlipDisplay seconds={timeLeft} />
      </div>

      {/* Controls (Moved to bottom when running, kept fully visible) */}
      <div className="controls" style={{
        position: active ? 'absolute' : 'relative',
        bottom: active ? '10%' : 'auto',
        marginTop: active ? '0' : '30px',
        transition: 'all 0.5s ease',
        zIndex: 10
      }}>
        {!active && (
          <button className="ctrl-btn ctrl-btn-primary" onClick={handleStart}>▶ START</button>
        )}
        {isRunning && <>
          {!settings.strictMode && (
            <button className="ctrl-btn ctrl-btn-outline" onClick={handlePause}>⏸ PAUSE</button>
          )}
          <button className="ctrl-btn ctrl-btn-outline" onClick={handleStopClick}>⏹ STOP</button>
        </>}
        {isPaused && <>
          <button className="ctrl-btn ctrl-btn-resume" onClick={handleResume}>▶ RESUME</button>
          <button className="ctrl-btn ctrl-btn-outline" onClick={handleStopClick}>⏹ STOP</button>
        </>}
      </div>
    </div>
  );
}

/* ================================================================
   STOPWATCH PAGE
   ================================================================ */
function StopwatchPage({ onStateChange }) {
  const [elapsed, setElapsed] = useState(0);
  const [isRunning, setIsRunning] = useState(false);
  const [laps, setLaps] = useState([]);
  const [subject, setSubject] = useState('');
  const intervalRef = useRef(null);

  useEffect(() => {
    if (isRunning) {
      intervalRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [isRunning]);

  const isActive = isRunning || elapsed > 0;
  useEffect(() => {
    if (onStateChange) {
      onStateChange(isActive);
    }
  }, [isActive, onStateChange]);

  function handleLap() {
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const label = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    setLaps(l => [...l, { num: l.length + 1, time: label }]);
  }

  function handleSave() {
    if (elapsed > 0) {
      saveSession(subject.trim() || 'Flow Session', elapsed);
    }
    setIsRunning(false);
    setElapsed(0);
    setLaps([]);
    setSubject('');
  }

  function handleDiscard() {
    if (window.confirm("Are you sure you want to discard this time without saving?")) {
      setIsRunning(false);
      setElapsed(0);
      setLaps([]);
      setSubject('');
    }
  }

  return (
    <div className="page" style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%' }}>
      
      <div className="subject-wrap" style={{ margin: 0, marginBottom: '2rem' }}>
        <input
          className={`subject-input${isRunning ? ' locked' : ''}`}
          type="text"
          placeholder="What are you working on?"
          value={subject}
          onChange={e => setSubject(e.target.value)}
          readOnly={isRunning}
          maxLength={50}
        />
      </div>

      <FlipDisplay seconds={elapsed} showHours={elapsed >= 3600} />
      
      <div className="controls">
        {!isRunning && elapsed === 0 && (
          <button className="ctrl-btn ctrl-btn-primary" onClick={() => setIsRunning(true)}>▶ START</button>
        )}
        {isRunning && <>
          <button className="ctrl-btn ctrl-btn-outline" onClick={() => setIsRunning(false)}>⏸ PAUSE</button>
          <button className="ctrl-btn ctrl-btn-outline" onClick={handleLap}>⧗ LAP</button>
        </>}
        {!isRunning && elapsed > 0 && <>
          <button className="ctrl-btn ctrl-btn-resume" onClick={() => setIsRunning(true)}>▶ RESUME</button>
          <button className="ctrl-btn ctrl-btn-outline" onClick={handleSave}>⏹ SAVE & STOP</button>
          <button className="icon-btn" style={{ height: 'clamp(45px, 6vh, 55px)', width: 'clamp(45px, 6vh, 55px)' }} onClick={handleDiscard} title="Discard">✕</button>
        </>}
      </div>
      
      {laps.length > 0 && (
        <div className="laps-container">
          {[...laps].reverse().map(l => (
            <div className="lap-entry" key={l.num}>
              <span className="lap-num">Lap {l.num}</span>
              <span>{l.time}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   CLOCK PAGE
   ================================================================ */
function ClockPage({ settings }) {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  let ampm = '';

  if (settings.clockFormat === '12h') {
    ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
  }

  const totalSeconds = h * 3600 + m * 60 + s;
  const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  return (
    <div className="page">
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '15px', position: 'relative' }}>
        <FlipDisplay seconds={totalSeconds} showHours />
        {ampm && <span style={{ fontSize: '1.5rem', fontWeight: 700, color: 'var(--text-muted)', position: 'absolute', right: '-40px', bottom: '15px' }}>{ampm}</span>}
      </div>
      <div className="clock-date">{dateStr}</div>
    </div>
  );
}

/* ================================================================
   BAR CHART (SVG)
   ================================================================ */
function BarChart() {
  const sessions = getSessions();
  const todayStr = getTodayStr();

  const DAYS = ['Su','M','T','W','Th','F','S'];
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const offset = d.getTimezoneOffset();
    const local = new Date(d.getTime() - offset * 60000);
    const dateStr = local.toISOString().split('T')[0];
    const minutes = sessions.filter(s => s.date === dateStr).reduce((a, s) => a + s.durationMinutes, 0);
    return { label: DAYS[d.getDay()], minutes, isToday: dateStr === todayStr };
  });

  // Increased H to 450 for a taller aspect ratio that fills the screen space
  const W = 800, H = 450, PL = 35, PB = 25, PT = 15, PR = 10;
  const cW = W - PL - PR, cH = H - PT - PB;
  const maxMin = Math.max(...days.map(d => d.minutes), 60);
  const bW = 50; 
  const gap = (cW - bW * 7) / 6;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="auto" style={{ overflow:'visible', display: 'block' }}>
      <line x1={PL} y1={PT} x2={PL} y2={H-PB} stroke="var(--border)" strokeWidth="1.5" />
      <line x1={PL} y1={H-PB} x2={W-PR} y2={H-PB} stroke="var(--border)" strokeWidth="1.5" />
      
      {[0,2,4,6,8].map(h => {
        const y = H - PB - (h * 60 / (maxMin > 480 ? maxMin : 480)) * cH;
        return <text key={h} x={PL-12} y={y+5} fill="var(--text-muted)" fontSize="14" fontWeight="500" textAnchor="end">{h}h</text>;
      })}
      
      {days.map((d, i) => {
        const x = PL + i * (bW + gap);
        const bH = Math.max(3, (d.minutes / Math.max(maxMin, 480)) * cH);
        const y = H - PB - bH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={bW} height={bH} rx="5"
              fill={d.isToday ? 'var(--accent)' : 'var(--border)'} 
              style={{ transition: 'all 0.3s ease' }} />
            <text x={x + bW/2} y={H-7} fill="var(--text-muted)" fontSize="14" fontWeight="500" textAnchor="middle">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ================================================================
   DASHBOARD
   ================================================================ */
function Dashboard({ settings, onClose }) {
  const [sessions, setSessions] = useState(getSessions);
  const todayStr = getTodayStr();

  const todayMin = sessions.filter(s => s.date === todayStr).reduce((a, s) => a + s.durationMinutes, 0);
  const h = Math.floor(todayMin / 60), m = todayMin % 60;
  
  // Progress computation relative to dailyGoal settings (converted to minutes)
  const progress = Math.min(100, Math.round((todayMin / (settings.dailyGoal * 60)) * 100));

  function handleDelete(id) {
    deleteSession(id);
    setSessions(getSessions());
  }

  const recent = [...sessions].reverse().slice(0, 8);

  return (
    <div className="dash-overlay">
      <div className="dash-navbar">
        <button className="icon-btn" onClick={onClose} title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <span className="dash-title">Dashboard</span>
        <span style={{width:34}} />
      </div>

      <div className="dash-content">
        <div className="dash-left">
          <div>
            <div className="summary-label">Today's Focus</div>
            <div className="summary-value">{h}h {m}m</div>
            <div style={{ marginTop: '0.75rem', width: '100%', maxWidth: '280px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', color: 'var(--text-muted)', marginBottom: '0.35rem', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                <span>Daily Goal Progress</span>
                <span>{progress}%</span>
              </div>
              <div style={{ height: '6px', background: 'var(--border)', borderRadius: '3px', overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${progress}%`, background: 'var(--accent)', borderRadius: '3px', transition: 'width 0.3s ease' }}></div>
              </div>
            </div>
          </div>
          <div>
            <div className="chart-title">Activity — Past 7 Days</div>
            <div className="chart-wrap"><BarChart /></div>
          </div>
        </div>

        <div className="dash-right">
          <div className="sessions-title">Recent Sessions</div>
          <div className="sessions-scroll">
            {recent.length === 0 && <div className="empty-msg">No sessions yet. Start focusing!</div>}
            {recent.map(s => {
              const d = new Date(s.id * 1000);
              let h = d.getHours();
              const m = String(d.getMinutes()).padStart(2, '0');
              let ampm = '';

              if (settings.clockFormat === '12h') {
                ampm = h >= 12 ? ' PM' : ' AM';
                h = h % 12 || 12;
              }

              const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
              const timeStr = `${String(h).padStart(2,'0')}:${m}${ampm}`;

              return (
                <div className="session-row" key={s.id}>
                  <div className="session-info">
                    <span className="session-subject">{s.subject}</span>
                    <span className="session-dur">{s.durationMinutes} min</span>
                  </div>
                  <div className="session-actions">
                    <span className="session-time" style={{ marginRight: '8px' }}>{dateStr}, {timeStr}</span>
                    <button className="btn-del" onClick={() => handleDelete(s.id)} title="Delete">✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ================================================================
   SETTINGS OVERLAY
   ================================================================ */
function Settings({ settings, setSettings, onClose }) {
  function handleClearData() {
    if (window.confirm("Are you sure you want to clear all your study data? This cannot be undone.")) {
      localStorage.removeItem('focus_sessions');
      alert("All data cleared successfully.");
      onClose();
    }
  }

  function updateSetting(key, val) {
    const newSettings = { ...settings, [key]: val };
    setSettings(newSettings);
    localStorage.setItem('focus_settings', JSON.stringify(newSettings));
  }

  const ACCENT_COLORS = [
    { name: 'Green', value: '#4CAF50' },
    { name: 'Blue', value: '#3B82F6' },
    { name: 'Red', value: '#EF4444' },
    { name: 'Amber', value: '#F59E0B' }
  ];

  return (
    <div className="dash-overlay">
      <div className="dash-navbar">
        <button className="icon-btn" onClick={onClose} title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <span className="dash-title">Settings</span>
        <span style={{width:34}} />
      </div>
      <div className="dash-content" style={{ display: 'flex', flexDirection: 'column', overflowY: 'auto', padding: '2rem 1.5rem', gap: '2rem', maxWidth: '500px', margin: '0 auto', width: '100%' }}>
        
        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          <h3 style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-muted)', borderBottom: '1px solid var(--divider)', paddingBottom: '0.5rem' }}>⏳ Durations & Goals</h3>
          <div className="settings-row"><span className="settings-label">Default Study (min)</span><input type="number" className="settings-input" value={settings.studyMin} onChange={e => updateSetting('studyMin', Math.max(1, parseInt(e.target.value) || 1))} /></div>
          <div className="settings-row"><span className="settings-label">Default Break (min)</span><input type="number" className="settings-input" value={settings.breakMin} onChange={e => updateSetting('breakMin', Math.max(1, parseInt(e.target.value) || 1))} /></div>
          <div className="settings-row"><span className="settings-label">Default Normal (min)</span><input type="number" className="settings-input" value={settings.normalMin} onChange={e => updateSetting('normalMin', Math.max(1, parseInt(e.target.value) || 1))} /></div>
          <div className="settings-row"><span className="settings-label">Daily Focus Goal (hrs)</span><input type="number" className="settings-input" value={settings.dailyGoal} onChange={e => updateSetting('dailyGoal', Math.max(1, parseInt(e.target.value) || 1))} /></div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          <h3 style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-muted)', borderBottom: '1px solid var(--divider)', paddingBottom: '0.5rem' }}>⚙️ Focus & Alerts</h3>
          <div className="settings-row"><span className="settings-label">Audio Alerts</span><label className="settings-toggle"><input type="checkbox" checked={settings.audioEnabled} onChange={e => updateSetting('audioEnabled', e.target.checked)} /><span className="toggle-slider"></span></label></div>
          <div className="settings-row"><span className="settings-label">Strict Mode</span><label className="settings-toggle"><input type="checkbox" checked={settings.strictMode} onChange={e => updateSetting('strictMode', e.target.checked)} /><span className="toggle-slider"></span></label></div>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
          <h3 style={{ fontSize: '0.75rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-muted)', borderBottom: '1px solid var(--divider)', paddingBottom: '0.5rem' }}>🎨 Display</h3>
          <div className="settings-row">
            <span className="settings-label">Clock Format</span>
            <select className="settings-input" style={{ width: 'auto', cursor: 'pointer' }} value={settings.clockFormat || '12h'} onChange={e => updateSetting('clockFormat', e.target.value)}>
              <option value="12h">12-Hour</option>
              <option value="24h">24-Hour</option>
            </select>
          </div>
          <div className="settings-row"><span className="settings-label">Accent Color</span><div className="color-picker">{ACCENT_COLORS.map(c => (<div key={c.value} className={`color-dot${settings.accentColor === c.value ? ' active' : ''}`} style={{ backgroundColor: c.value }} onClick={() => updateSetting('accentColor', c.value)} title={c.name} />))}</div></div>
        </div>

        <button onClick={handleClearData} style={{ padding: '10px', background: 'transparent', border: '1px solid #ff4444', color: '#ff4444', borderRadius: '6px', cursor: 'pointer', marginTop: '1rem', transition: 'all 0.2s' }}>Clear All Study Data</button>
      </div>
    </div>
  );
}

/* ================================================================
   NAVBAR
   ================================================================ */
function Navbar({ tab, setTab, theme, cycleTheme, showDash, setShowDash, showSettings, setShowSettings }) {
  const themeIcon = theme === 'light' ? '☀' : theme === 'dark' ? '◑' : '◉';
  const themeTitle = theme === 'light' ? 'Light mode' : theme === 'dark' ? 'Dark mode' : 'Flip Clock mode';

  return (
    <nav className="navbar">
      <span className="navbar-brand">FOCUS</span>

      <div className="navbar-tabs">
        {['Timer','Stopwatch','Clock'].map(t => (
          <button key={t} className={`tab-btn${tab===t?' active':''}`} onClick={() => setTab(t)}>{t}</button>
        ))}
      </div>

      <div className="navbar-right">
        <button className="icon-btn" onClick={cycleTheme} title={themeTitle}>{themeIcon}</button>
        <button className={`icon-btn${showDash?' active':''}`}
          onClick={() => { setShowDash(s => !s); setShowSettings(false); }} title="Dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </button>
        <button className={`icon-btn${showSettings?' active':''}`}
          onClick={() => { setShowSettings(s => !s); setShowDash(false); }} title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0a2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </nav>
  );
}

/* ================================================================
   ROOT APP
   ================================================================ */
function App() {
  const [tab, setTab] = useState('Timer');
  const [showDash, setShowDash] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [timerActive, setTimerActive] = useState(false);
  const [stopwatchActive, setStopwatchActive] = useState(false);

  const [settings, setSettings] = useState(() => {
    try {
      const saved = localStorage.getItem('focus_settings');
      if (saved) {
        return {
          studyMin: 25,
          breakMin: 5,
          normalMin: 25,
          audioEnabled: true,
          strictMode: false,
          dailyGoal: 4,
          accentColor: '#4CAF50',
          clockFormat: '12h',
          ...JSON.parse(saved)
        };
      }
    } catch (e) {}
    return {
      studyMin: 25,
      breakMin: 5,
      normalMin: 25,
      audioEnabled: true,
      strictMode: false,
      dailyGoal: 4,
      accentColor: '#4CAF50',
      clockFormat: '12h'
    };
  });

  const [theme, setTheme] = useState(() => {
    const saved = localStorage.getItem('focus_theme');
    if (saved) return saved;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'flip';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('focus_theme', theme);
  }, [theme]);

  // Update dynamic --accent property on CSS root variables
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', settings.accentColor);
  }, [settings.accentColor]);

  function cycleTheme() {
    setTheme(t => t === 'flip' ? 'dark' : t === 'dark' ? 'light' : 'flip');
  }

  return (
    <div className="app">
      <Navbar tab={tab} setTab={setTab} theme={theme} cycleTheme={cycleTheme}
        showDash={showDash} setShowDash={setShowDash} 
        showSettings={showSettings} setShowSettings={setShowSettings} />

      <div className="app-main">
        <div 
          className={`page-wrapper ${tab === 'Timer' ? 'active' : timerActive ? 'mini' : 'hidden'}`}
          onClick={() => { if (tab !== 'Timer' && timerActive) setTab('Timer'); }}
          title={tab !== 'Timer' && timerActive ? "Click to return to Timer" : ""}
        >
          <TimerPage onStateChange={setTimerActive} settings={settings} />
        </div>

        <div 
          className={`page-wrapper ${tab === 'Stopwatch' ? 'active' : stopwatchActive ? 'mini' : 'hidden'}`}
          onClick={() => { if (tab !== 'Stopwatch' && stopwatchActive) setTab('Stopwatch'); }}
          title={tab !== 'Stopwatch' && stopwatchActive ? "Click to return to Stopwatch" : ""}
        >
          <StopwatchPage onStateChange={setStopwatchActive} />
        </div>

        <div className={`page-wrapper ${tab === 'Clock' ? 'active' : 'hidden'}`}>
          <ClockPage settings={settings} />
        </div>
      </div>

      {showDash && <Dashboard settings={settings} onClose={() => setShowDash(false)} />}
      {showSettings && <Settings settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
